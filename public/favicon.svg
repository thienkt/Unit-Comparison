<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Blade Silver Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Shape -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  <!-- Inner Rim -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="10.5" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Crossed Swords in Background -->
  <g opacity="0.4" stroke-linecap="round">
    <!-- Sword 1: Top-Left to Bottom-Right -->
    <line x1="16" y1="16" x2="48" y2="48" stroke="url(#bladeGrad)" stroke-width="2.2" />
    <line x1="20" y1="26" x2="26" y2="20" stroke="url(#goldBorder)" stroke-width="2" />
    <circle cx="16" cy="16" r="1.5" fill="#f59e0b" />

    <!-- Sword 2: Top-Right to Bottom-Left -->
    <line x1="48" y1="16" x2="16" y2="48" stroke="url(#bladeGrad)" stroke-width="2.2" />
    <line x1="44" y1="26" x2="38" y2="20" stroke="url(#goldBorder)" stroke-width="2" />
    <circle cx="48" cy="16" r="1.5" fill="#f59e0b" />
  </g>

  <!-- Crown / Star Accent at Top -->
  <path d="M32 9.5 L33.5 13 L37 13.5 L34.5 16 L35 19.5 L32 18 L29 19.5 L29.5 16 L27 13.5 L30.5 13 Z" fill="url(#goldBorder)" />

  <!-- Iconic "IV" Roman Numeral -->
  <!-- Subtle shadow for depth -->
  <text x="32" y="44.5" 
        font-family="'Cinzel', 'Times New Roman', serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="1.5" 
        text-anchor="middle" 
        fill="#000000" 
        opacity="0.75">IV</text>

  <!-- Foreground Gold Text -->
  <text x="32" y="43" 
        font-family="'Cinzel', 'Times New Roman', serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="1.5" 
        text-anchor="middle" 
        fill="url(#goldText)"
        filter="url(#goldGlow)">IV</text>

  <!-- Bottom Mini Banner Accent: "AOE" -->
  <text x="32" y="53" 
        font-family="'Outfit', sans-serif" 
        font-size="6" 
        font-weight="800" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#94a3b8" 
        opacity="0.85">AOE</text>
</svg>
